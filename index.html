<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR ボクセルエディタ</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #0a0e1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { position: fixed; inset: 0; z-index: 0; display: block; }

    /* ── Start screen ──────────────────────────────────── */
    #start-screen {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(150deg, #0a0e1a 0%, #0d2040 60%, #0a1a30 100%);
      padding: 32px;
    }
    #start-screen h1 {
      color: #fff; font-size: 26px; font-weight: 800;
      margin-bottom: 8px; text-align: center; letter-spacing: -0.5px;
    }
    #start-screen .sub {
      color: rgba(255,255,255,0.5); font-size: 13px;
      text-align: center; margin-bottom: 40px; line-height: 1.7;
    }
    .steps { width: 100%; max-width: 320px; margin-bottom: 40px; }
    .step  { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 18px; }
    .num {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      background: rgba(79,172,254,0.2); border: 1.5px solid rgba(79,172,254,0.5);
      color: #4facfe; display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; margin-top: 1px;
    }
    .step p { color: rgba(255,255,255,0.75); font-size: 13px; line-height: 1.55; }
    #ar-btn {
      background: linear-gradient(135deg, #4facfe, #00d4ff);
      color: #fff; border: none; padding: 16px 52px; border-radius: 32px;
      font-size: 17px; font-weight: 700; cursor: pointer;
      box-shadow: 0 6px 28px rgba(79,172,254,0.38);
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Not supported ─────────────────────────────────── */
    #not-supported {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: #0a0e1a; color: #fff;
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 40px;
    }
    #not-supported h2 { font-size: 20px; margin-bottom: 16px; }
    #not-supported p  { color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.75; }

    /* ── AR UI (dom-overlay) ───────────────────────────── */
    #ar-ui {
      display: none; position: fixed; inset: 0; z-index: 50; pointer-events: none;
    }

    #topbar {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: rgba(0,0,0,0.52); backdrop-filter: blur(12px);
      color: #fff; font-size: 13px; font-weight: 600;
    }
    #phase-badge {
      font-size: 11px; font-weight: 500; padding: 4px 11px;
      border-radius: 12px; transition: all 0.3s;
      background: rgba(255,200,0,0.18); color: #ffcc00;
      border: 1px solid rgba(255,200,0,0.35);
    }
    #phase-badge.ok {
      background: rgba(68,255,136,0.18); color: #44ff88;
      border-color: rgba(68,255,136,0.35);
    }

    #hint {
      position: absolute; bottom: 90px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.68); color: #fff;
      padding: 11px 24px; border-radius: 22px;
      font-size: 13px; white-space: nowrap;
      transition: opacity 0.6s; pointer-events: none;
    }

    #bottom {
      position: absolute; bottom: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      background: rgba(0,0,0,0.52); backdrop-filter: blur(12px);
      pointer-events: all;
    }
    .btn {
      color: #fff; border: none; padding: 10px 18px;
      border-radius: 12px; font-size: 13px; font-weight: 600;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #undo-btn   { background: rgba(80,80,100,0.9); }
    #reset-btn  { background: rgba(200,55,55,0.9); }
    #repl-btn   {
      display: none; position: absolute; top: 60px; right: 12px;
      background: rgba(55,120,220,0.88); font-size: 11px;
      padding: 8px 13px; pointer-events: all;
    }

    #counter { text-align: center; color: #fff; }
    #counter big   { font-size: 26px; font-weight: 800; display: block; line-height: 1; }
    #counter small { font-size: 10px; opacity: 0.55; display: block; margin-top: 3px; }

    /* ── Ripple canvas ─────────────────────────────────── */
    #ripple-cv { position: fixed; inset: 0; z-index: 49; pointer-events: none; }
  </style>
</head>
<body>

<!-- ── Start screen ─────────────────────────────────────── -->
<div id="start-screen">
  <h1>AR ボクセルエディタ</h1>
  <p class="sub">1 m × 1 m の紙（4×4グリッド）をカメラで映して<br>ボクセルを積み上げましょう</p>
  <div class="steps">
    <div class="step"><div class="num">1</div><p>HTTPS アクセス &amp; カメラ許可を確認</p></div>
    <div class="step"><div class="num">2</div><p>「AR を開始」→ 紙の上にリングが出たらタップしてグリッドを配置</p></div>
    <div class="step"><div class="num">3</div><p>グリッドのセルをタップ → 半透明ボクセルが積まれる</p></div>
  </div>
  <button id="ar-btn" onclick="startAR()">AR を開始</button>
</div>

<!-- ── Unsupported ──────────────────────────────────────── -->
<div id="not-supported">
  <h2>WebXR AR 非対応</h2>
  <p>
    iOS 15.4 以降の <strong>Safari</strong> または<br>
    Android の <strong>Chrome</strong> をご利用ください。<br><br>
    <strong>HTTPS</strong> 接続が必要です。
  </p>
</div>

<!-- ── AR UI overlay ────────────────────────────────────── -->
<div id="ar-ui">
  <div id="topbar">
    <span>AR ボクセルエディタ</span>
    <span id="phase-badge">検索中…</span>
  </div>

  <div id="hint">カメラで紙を映してください</div>

  <button class="btn" id="repl-btn" onclick="replaceGrid()">再配置</button>

  <div id="bottom">
    <button class="btn" id="undo-btn"  onclick="undoVoxel()">↩ 戻す</button>
    <div id="counter"><big id="count">0</big><small>ボクセル</small></div>
    <button class="btn" id="reset-btn" onclick="resetVoxels()">🗑 リセット</button>
  </div>
</div>

<!-- ── Tap ripple ────────────────────────────────────────── -->
<canvas id="ripple-cv"></canvas>

<script>
'use strict';

// ═══════════════════ Config ═══════════════════════════════
const GRID_N = 4;
const GRID_M = 1.0;              // 1 m × 1 m
const CELL   = GRID_M / GRID_N; // 0.25 m per cell
const VOX_H  = CELL;            // cubic voxels
const HALF   = GRID_M / 2;      // 0.5 m

// One hue per column  (blue / red / green / amber)
const PALETTE = [0x4488ff, 0xff5544, 0x44cc66, 0xffaa22];

// ═══════════════════ Three.js bootstrap ═══════════════════
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
document.body.prepend(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 200);
scene.add(camera);

scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(2, 5, 3);
scene.add(sun);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ═══════════════════ Grid group ═══════════════════════════
const gridGroup = new THREE.Group();
gridGroup.visible = false;
scene.add(gridGroup);

// ─── Reticle (placement guide ring) ───────────────────────
const reticle = (() => {
  const geo = new THREE.RingGeometry(0.07, 0.095, 40);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshBasicMaterial({ color: 0x44aaff, side: THREE.DoubleSide });
  const m = new THREE.Mesh(geo, mat);
  m.matrixAutoUpdate = false;
  m.visible = false;
  scene.add(m);
  return m;
})();

// ═══════════════════ State ════════════════════════════════
let heights = mkHeights();
let history = [];   // [{row, col, mesh}]
let phase   = 'scanning'; // scanning | placing | editing
let lastTap = 0;

function mkHeights() {
  return Array.from({length: GRID_N}, () => new Array(GRID_N).fill(0));
}

// ═══════════════════ Grid builder ═════════════════════════
function buildGrid() {
  gridGroup.clear();

  // Translucent base
  const base = new THREE.Mesh(
    new THREE.PlaneGeometry(GRID_M, GRID_M),
    new THREE.MeshBasicMaterial({
      color: 0xffffff, opacity: 0.08,
      transparent: true, side: THREE.DoubleSide, depthWrite: false
    })
  );
  base.rotation.x = -Math.PI / 2;
  gridGroup.add(base);

  // Grid lines
  const lm = new THREE.LineBasicMaterial({ color: 0x111111, opacity: 0.7, transparent: true });
  for (let i = 0; i <= GRID_N; i++) {
    const p = -HALF + i * CELL;
    gridGroup.add(seg(-HALF, 0.003, p,  HALF, 0.003, p,  lm));
    gridGroup.add(seg(p, 0.003, -HALF,  p, 0.003,  HALF, lm));
  }

  // Cell colour tints
  for (let r = 0; r < GRID_N; r++) {
    for (let c = 0; c < GRID_N; c++) {
      const tile = new THREE.Mesh(
        new THREE.PlaneGeometry(CELL * 0.93, CELL * 0.93),
        new THREE.MeshBasicMaterial({
          color: PALETTE[c], opacity: 0.08,
          transparent: true, side: THREE.DoubleSide, depthWrite: false
        })
      );
      tile.rotation.x = -Math.PI / 2;
      tile.position.set(
        -HALF + c * CELL + CELL / 2, 0.001,
        -HALF + r * CELL + CELL / 2
      );
      gridGroup.add(tile);
    }
  }
}

function seg(x1,y1,z1, x2,y2,z2, mat) {
  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(x1,y1,z1), new THREE.Vector3(x2,y2,z2)
  ]);
  return new THREE.Line(geo, mat);
}

// ═══════════════════ Voxel ops ════════════════════════════
function addVoxel(row, col) {
  const stack = heights[row][col];
  const x = -HALF + col * CELL + CELL / 2;
  const z = -HALF + row * CELL + CELL / 2;
  const y = stack * VOX_H + VOX_H / 2;

  const hue = colHue(PALETTE[col]);
  const lig = Math.min(50 + stack * 6, 78);
  const color = new THREE.Color(`hsl(${hue},65%,${lig}%)`);

  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(CELL * 0.86, VOX_H * 0.90, CELL * 0.86),
    new THREE.MeshPhongMaterial({
      color, opacity: 0.72, transparent: true,
      side: THREE.DoubleSide, shininess: 55
    })
  );
  mesh.position.set(x, y, z);
  mesh.scale.setScalar(0.01);
  gridGroup.add(mesh);
  popIn(mesh, 200);

  heights[row][col]++;
  history.push({row, col, mesh});
  document.getElementById('count').textContent = history.length;
}

function undoVoxel() {
  if (!history.length) return;
  const {row, col, mesh} = history.pop();
  gridGroup.remove(mesh);
  mesh.geometry.dispose(); mesh.material.dispose();
  heights[row][col]--;
  document.getElementById('count').textContent = history.length;
}

function resetVoxels() {
  history.forEach(({mesh}) => {
    gridGroup.remove(mesh);
    mesh.geometry.dispose(); mesh.material.dispose();
  });
  history = []; heights = mkHeights();
  document.getElementById('count').textContent = 0;
}

// ═══════════════════ Grid placement ═══════════════════════
function placeGrid() {
  if (!reticle.visible) return;
  gridGroup.position.setFromMatrixPosition(reticle.matrix);
  gridGroup.quaternion.setFromRotationMatrix(reticle.matrix);
  gridGroup.visible = true;
  reticle.visible   = false;
  document.getElementById('repl-btn').style.display = 'block';
  setPhase('editing');
}

function replaceGrid() {
  gridGroup.visible = false;
  reticle.visible   = false;
  resetVoxels();
  document.getElementById('repl-btn').style.display = 'none';
  setPhase('scanning');
}

// ═══════════════════ Tap → voxel ══════════════════════════
const raycaster  = new THREE.Raycaster();
const gridNormal = new THREE.Vector3();
const gridOrigin = new THREE.Vector3();
const hitPlane   = new THREE.Plane();

function handleTap(e) {
  const now = Date.now();
  if (now - lastTap < 280) return;
  lastTap = now;

  // Ignore taps on UI buttons
  if (e.target && e.target.closest) {
    if (e.target.closest('#bottom') || e.target.closest('#repl-btn')) return;
  }

  if (phase === 'placing') { placeGrid(); return; }
  if (phase !== 'editing') return;

  let cx, cy;
  if (e.touches && e.touches.length) {
    cx = e.touches[0].clientX; cy = e.touches[0].clientY;
  } else {
    cx = e.clientX; cy = e.clientY;
  }

  spawnRipple(cx, cy);

  const ndcX =  (cx / window.innerWidth)  * 2 - 1;
  const ndcY = -(cy / window.innerHeight) * 2 + 1;

  // In WebXR, renderer.xr.getCamera().cameras[0] is the mono perspective cam
  const xrCam   = renderer.xr.getCamera();
  const perspCam = (xrCam.cameras && xrCam.cameras.length)
    ? xrCam.cameras[0] : xrCam;
  raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), perspCam);

  // Grid plane in world space
  gridGroup.getWorldPosition(gridOrigin);
  gridGroup.getWorldQuaternion(
    new THREE.Quaternion().setFromRotationMatrix(gridGroup.matrixWorld)
  );
  gridNormal.set(0, 1, 0).applyQuaternion(
    new THREE.Quaternion().setFromRotationMatrix(gridGroup.matrixWorld)
  );
  hitPlane.setFromNormalAndCoplanarPoint(gridNormal, gridOrigin);

  const hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(hitPlane, hit)) return;

  const local = gridGroup.worldToLocal(hit.clone());
  const col   = Math.floor((local.x + HALF) / CELL);
  const row   = Math.floor((local.z + HALF) / CELL);

  if (col >= 0 && col < GRID_N && row >= 0 && row < GRID_N) {
    addVoxel(row, col);
  }
}

document.addEventListener('touchstart', handleTap, {passive: true});
document.addEventListener('click',      handleTap);

// ═══════════════════ Phase UI ═════════════════════════════
function setPhase(p) {
  phase = p;
  const hint  = document.getElementById('hint');
  const badge = document.getElementById('phase-badge');
  hint.style.opacity = '1'; hint.style.transition = '';
  badge.classList.remove('ok');

  switch (p) {
    case 'scanning':
      hint.textContent  = '平らな面（紙）をカメラで映してください';
      badge.textContent = '検索中…';
      break;
    case 'placing':
      hint.textContent  = 'リングが表示されました — タップしてグリッドを配置';
      badge.textContent = 'タップして配置';
      break;
    case 'editing':
      hint.textContent  = 'グリッドをタップしてボクセルを追加';
      badge.textContent = '編集中'; badge.classList.add('ok');
      setTimeout(() => {
        hint.style.transition = 'opacity 0.7s';
        hint.style.opacity = '0';
      }, 3500);
      break;
  }
}

// ═══════════════════ Ripple ═══════════════════════════════
const rcv   = document.getElementById('ripple-cv');
const rctx  = rcv.getContext('2d');
let ripples = [];

function resizeRippleCanvas() {
  rcv.width = window.innerWidth; rcv.height = window.innerHeight;
}
resizeRippleCanvas();
window.addEventListener('resize', resizeRippleCanvas);

function spawnRipple(x, y) { ripples.push({x, y, r: 0, a: 0.7}); }

(function animRipples() {
  rctx.clearRect(0, 0, rcv.width, rcv.height);
  ripples = ripples.filter(p => p.a > 0.02);
  for (const p of ripples) {
    p.r += 4.5; p.a *= 0.85;
    rctx.beginPath();
    rctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    rctx.strokeStyle = `rgba(255,255,255,${p.a})`;
    rctx.lineWidth = 2.5;
    rctx.stroke();
  }
  requestAnimationFrame(animRipples);
})();

// ═══════════════════ Helpers ══════════════════════════════
function popIn(obj, dur) {
  const t0 = performance.now();
  (function tick() {
    const t = Math.min((performance.now() - t0) / dur, 1);
    const s = easeOutBack(t);
    obj.scale.setScalar(Math.max(s, 0.001));
    if (t < 1) requestAnimationFrame(tick);
  })();
}
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function colHue(hex) {
  const c = new THREE.Color(hex);
  const M = Math.max(c.r,c.g,c.b), m = Math.min(c.r,c.g,c.b), d = M - m;
  if (!d) return 0;
  let h = M === c.r ? (c.g - c.b)/d : M === c.g ? (c.b - c.r)/d + 2 : (c.r - c.g)/d + 4;
  return Math.round(h * 60 + (h < 0 ? 360 : 0));
}

// ═══════════════════ WebXR session ════════════════════════
let xrSession     = null;
let hitTestSrc    = null;
let localRefSpace = null;

async function startAR() {
  if (!navigator.xr) { showUnsupported(); return; }
  const ok = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
  if (!ok) { showUnsupported(); return; }

  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('ar-ui').style.display = 'block';

  const opts = {
    requiredFeatures: ['hit-test', 'local'],
    optionalFeatures: ['dom-overlay', 'anchors'],
    domOverlay: {root: document.getElementById('ar-ui')}
  };
  try {
    xrSession = await navigator.xr.requestSession('immersive-ar', opts);
  } catch {
    try {
      xrSession = await navigator.xr.requestSession('immersive-ar',
        {requiredFeatures: ['hit-test', 'local']});
    } catch {
      showUnsupported(); return;
    }
  }

  await renderer.xr.setSession(xrSession);
  renderer.setAnimationLoop(onFrame);

  xrSession.addEventListener('end', () => {
    hitTestSrc?.cancel(); hitTestSrc = null;
    renderer.setAnimationLoop(null);
  });

  localRefSpace = await xrSession.requestReferenceSpace('local');
  const viewerSpace = await xrSession.requestReferenceSpace('viewer');
  hitTestSrc = await xrSession.requestHitTestSource({space: viewerSpace});

  buildGrid();
  setPhase('scanning');
}

// ═══════════════════ Render / XR frame ════════════════════
function onFrame(time, frame) {
  if (!frame) { renderer.render(scene, camera); return; }

  if (hitTestSrc && (phase === 'scanning' || phase === 'placing')) {
    const results = frame.getHitTestResults(hitTestSrc);
    if (results.length > 0) {
      const pose = results[0].getPose(localRefSpace);
      reticle.visible = true;
      reticle.matrix.fromArray(pose.transform.matrix);
      if (phase === 'scanning') setPhase('placing');
    } else {
      reticle.visible = false;
      if (phase === 'placing') setPhase('scanning');
    }
  }

  renderer.render(scene, camera);
}

function showUnsupported() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('not-supported').style.display = 'flex';
}
</script>
</body>
</html>
